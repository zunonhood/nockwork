[package]
name = "shellwork"
version = "0.1.0"
description = "Solana component registry and license market for Shellwork"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shellwork"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
